services:
  postgres:
    image: postgres:16
    container_name: round-squares-postgres
    environment:
      POSTGRES_USER: roundsquares
      POSTGRES_PASSWORD: roundsquares
      POSTGRES_DB: roundsquares
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roundsquares']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
