services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: round-squares-mailpit
    ports:
      - '8025:8025' # Web UI
      - '1025:1025' # SMTP server
    environment:
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:8025',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
